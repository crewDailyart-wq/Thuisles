name: Atelier 3D prototype
on:
  pull_request:
    paths:
      - 'src/components/zappie/atelier/**'
      - 'public/atelier/**'
      - 'src/app/atelier-prototype/**'
      - 'scripts/atelier-preview-test.mjs'
      - '.github/workflows/atelier-preview.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/zappie/atelier src/app/atelier-prototype
      - run: node scripts/zappie-preview-build.mjs
      - name: Browser and interaction checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/atelier-preview-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-3d-preview
          path: preview-artifacts/atelier/
          retention-days: 7
