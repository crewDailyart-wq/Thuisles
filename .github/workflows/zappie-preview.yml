name: Zappie preview controleren

on:
  push:
    branches: [feature/zappie-cinematische-homepage-20261013]
  pull_request:
    paths:
      - 'src/components/zappie/**'
      - 'src/lib/zappie/**'
      - 'scripts/zappie-preview*'
      - '.github/workflows/zappie-preview.yml'

permissions:
  contents: read

concurrency:
  group: zappie-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controleren:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Broncode voor review verzamelen (geen database of geheimen)
        run: |
          mkdir -p preview-artifacts
          git archive --format=zip HEAD src public scripts package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs eslint.config.mjs > preview-artifacts/zappie-broncode.zip
      - name: Pakketten installeren
        run: npm ci
      - name: TypeScript en productiebuild
        run: npm run build
      - name: Visuele controle wanneer het testscript beschikbaar is
        run: |
          if test -f scripts/zappie-preview-test.mjs; then
            npm install --no-save --package-lock=false playwright
            npx playwright install --with-deps chromium
            node scripts/zappie-preview-test.mjs
          fi
      - name: Controlebestanden bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zappie-preview-controle
          path: preview-artifacts/
          retention-days: 7
          if-no-files-found: warn
